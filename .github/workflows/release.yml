name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish win-x64
        run: dotnet publish .\CodexBeacon.csproj -c Release -r win-x64 --self-contained true -o .\publish\win-x64
      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path .\publish\win-x64\* -DestinationPath .\CodexBeacon-win-x64.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" .\CodexBeacon-win-x64.zip --generate-notes --verify-tag
